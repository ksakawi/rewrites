            <path class="p11" d="m 50 75.98 a 30 30 0 0 1 0 -51.96 a 30 30 0 0 1 0 51.96" />
            <path class="p10" d="m 50 24.02 a 30 30 0 0 0 0 51.96 a 30 30 0 1 1 0 -51.96" />

            document.querySelectorAll("span").forEach((s) => {
                const mine = svg.cloneNode(true)
                mine.removeAttribute("id")
                s.appendChild(mine)
            })
            svg.remove()
